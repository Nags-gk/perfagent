[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfagent"
version = "0.1.0"
description = "An LLM agent that automates performance-modeling workflows on InferSim: simulation, bottleneck analysis and design space exploration, with a ground-truth benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "infersim @ git+https://github.com/Nags-gk/infersim@main",
  "langgraph>=1.0",
  "openai>=1.40",
  "mcp>=2.0",
  "optuna>=4.0",
  "opentelemetry-sdk>=1.25",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
perfagent-eval = "perfagent.eval:main"
perfagent-mcp = "perfagent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["perfagent*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
